version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    ignore:
      # engines.node >= 22 に合わせる。@types/node は対応 Node の下限に固定
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      webref:
        patterns:
          - '@webref/*'
          - 'web-specs'
      dev-dependencies:
        dependency-type: 'development'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'github-actions'
